<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Moved to apexops.pro</title>
    <meta name="robots" content="noindex" />
    <!--
      GitHub Pages serves this 404.html for any unknown path. Rewrite the old
      project-pages deep link to the new custom domain at root, preserving the
      remainder of the path (trailingSlash preserved by GitHub redirects).
    -->
    <script>
      (function () {
        var base = "/azure-agentic-infraops";
        var path = window.location.pathname || "/";
        if (path.indexOf(base) === 0) path = path.slice(base.length) || "/";
        var target = "https://apexops.pro" + path + window.location.search + window.location.hash;
        window.location.replace(target);
      })();
    </script>
  </head>
  <body>
    <p>
      This page moved to
      <a href="https://apexops.pro/">apexops.pro</a>. Redirecting&hellip;
    </p>
  </body>
</html>
